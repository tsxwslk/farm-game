<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>物志 · 作物分册</title>
    <style>
      :root {
        --paper: #faf8ef;
        --ink: #293d32;
        --muted: #596b5c;
        --line: #d3d6c6;
        --rust: #9c4a32;
        --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        --sans: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.55 var(--sans);
      }
      main,
      header {
        width: min(1240px, 94%);
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 19px 0;
        border-bottom: 2px solid var(--ink);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 700 21px var(--serif);
        letter-spacing: 0.08em;
      }
      .brand svg {
        width: 34px;
        height: 34px;
      }
      header small,
      .latin,
      .count {
        font:
          italic 14px Georgia,
          serif;
        color: var(--muted);
      }
      .intro {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 26px;
        align-items: center;
        padding: 26px 0 30px;
        border-bottom: 1px solid var(--ink);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font: 700 clamp(38px, 4.5vw, 64px)/1.18 var(--serif);
        letter-spacing: 0.05em;
      }
      .intro p {
        color: var(--muted);
        margin-top: 14px;
        font-size: 14px;
      }
      .plate {
        display: flex;
        align-items: end;
        justify-content: center;
        background: #eeeeda;
        border-radius: 85px 4px 4px 4px;
        padding: 7px 8px 10px;
      }
      button,
      summary,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible {
        outline: 3px solid #ad6437;
        outline-offset: 2px;
      }
      .plate button,
      .cell {
        border: none;
        background: transparent;
      }
      .plate button {
        width: 31%;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .plate svg {
        width: min(95%, 110px);
        display: block;
        margin: auto;
        transition: transform 0.18s;
      }
      .plate button:hover svg,
      .cell:hover .sample {
        transform: translateY(-3px);
      }
      .tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 17px 0;
      }
      .tabs,
      .view,
      .options,
      .variants {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tabs button,
      .view button,
      .options button,
      .variants button {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        padding: 6px 11px;
        font-size: 13px;
      }
      button[aria-pressed='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fffdf6;
      }
      .view {
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }
      .catalogue {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
      }
      .cell {
        min-width: 0;
        background: #fffdf6;
        display: flex;
        align-items: center;
        text-align: center;
        flex-direction: column;
        padding: 14px 5px 12px;
      }
      .cell:hover {
        background: #f3f2e5;
      }
      .mount {
        height: 104px;
        display: grid;
        place-items: center;
        width: 100%;
      }
      .sample svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sample {
        display: block;
        width: 100px;
        height: 100px;
        transition: transform 0.18s;
      }
      .compact .sample {
        width: 32px;
        height: 32px;
      }
      .gray .sample,
      .gray .plate svg {
        filter: grayscale(1);
      }
      .name {
        font: 700 18px/1.5 var(--serif);
        letter-spacing: 0.07em;
      }
      .latin {
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.02em;
      }
      .options {
        gap: 12px 22px;
        padding: 12px 0 20px;
      }
      .options label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      input {
        width: 96px;
        accent-color: var(--ink);
      }
      output {
        min-width: 32px;
        font-size: 12px;
      }
      details {
        margin: 14px 0 46px;
        color: var(--muted);
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        width: fit-content;
        padding: 5px 0;
      }
      dialog {
        background: var(--paper);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0;
        width: min(680px, 94vw);
        max-height: 90dvh;
        box-shadow: 0 18px 75px #23392d35;
      }
      dialog::backdrop {
        background: #1c30297a;
      }
      .inside {
        padding: 26px 30px;
      }
      .close {
        float: right;
        width: 35px;
        height: 35px;
        background: transparent;
        border-radius: 50%;
        border: 1px solid var(--line);
        font: 23px/1 sans-serif;
      }
      .detail-head {
        display: flex;
        align-items: center;
        gap: 24px;
        margin: 12px 0 20px;
      }
      .hero {
        width: 150px;
        background: #efefdf;
        border-radius: 50%;
        flex: none;
      }
      .hero svg,
      .stage svg {
        display: block;
        width: 100%;
      }
      h2 {
        font: 700 32px var(--serif);
      }
      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      h3 {
        font: 700 16px var(--serif);
        margin: 16px 0 9px;
      }
      .variants button {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #0003;
      }
      .rows {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
      }
      .stages {
        display: flex;
        gap: 8px;
      }
      .stage {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .stage svg {
        width: 56px;
        height: 56px;
        background: #f0f0e3;
        border-radius: 4px;
      }
      .export {
        margin-top: 22px;
        border: 0;
        border-radius: 4px;
        background: var(--ink);
        color: var(--paper);
        padding: 8px 14px;
      }
      #stages button {
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 2px;
        background: transparent;
      }
      #stages button[aria-pressed='true'] {
        border-color: var(--ink);
        color: var(--ink);
      }
      #stages {
        flex-wrap: wrap;
      }
      .quality svg {
        border-bottom: 3px solid var(--q);
      }
      @media (max-width: 900px) {
        .catalogue {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 610px) {
        main,
        header {
          width: 92%;
        }
        .intro {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 22px 0;
        }
        .intro p {
          margin-top: 7px;
        }
        .plate svg {
          width: 74px;
        }
        .catalogue {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .sample {
          width: 80px;
          height: 80px;
        }
        .mount {
          height: 80px;
        }
        .tools {
          gap: 8px;
        }
        .view {
          padding: 0;
          border: 0;
        }
        .cell {
          padding: 10px 3px;
        }
        .name {
          font-size: 16px;
        }
        .latin {
          font-size: 12px;
        }
        .inside {
          padding: 18px;
        }
        .hero {
          width: 100px;
        }
        .detail-head {
          gap: 12px;
        }
        .rows {
          display: block;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="9" fill="#304939" />
          <path
            d="M10 26Q19 25 24 10M19 21Q9 22 8 13Q17 12 19 21M21 17Q20 8 29 7Q30 14 21 17"
            fill="#e1d99c"
            stroke="#e1d99c"
            stroke-width="1.2"
          /></svg
        >物志
      </div>
      <small>作物图标原型</small>
    </header>
    <main>
      <section class="intro">
        <div>
          <h1>作物分册</h1>
          <p>切换生长阶段比较株形，点选作物查看完整生长过程。</p>
          <p class="count" id="total"></p>
        </div>
        <div class="plate" id="plate" aria-label="红苹果、黄苹果与橘子的形态对照"></div>
      </section>
      <div id="phase" class="tabs" role="group" aria-label="显示阶段" style="margin-top: 16px"></div>
      <div class="tools">
        <nav class="tabs" id="tabs" aria-label="作物分类"></nav>
        <div class="view">
          <button id="small" aria-pressed="false">背包尺寸 · 32 px</button
          ><button id="gray" aria-pressed="false">灰度</button>
        </div>
      </div>
      <div id="grid" class="catalogue"></div>
      <details>
        <summary>图标参数</summary>
        <div class="options">
          <label
            >果色偏移<input id="hue" type="range" min="-180" max="180" value="0" /><output id="hueVal"
              >0°</output
            ></label
          ><label
            >叶色偏移<input id="leaf" type="range" min="-40" max="40" value="0" /><output id="leafVal"
              >0°</output
            ></label
          ><button id="reroll">变换姿态</button><button id="reset">复位</button>
        </div>
      </details>
    </main>
    <dialog id="detail" aria-labelledby="mName">
      <div class="inside">
        <button class="close" aria-label="关闭详情" id="closeBtn">×</button>
        <div class="detail-head">
          <div class="hero" id="hero"></div>
          <div>
            <div class="latin" id="mLatin"></div>
            <h2 id="mName"></h2>
            <p id="mMeta" class="meta"></p>
          </div>
        </div>
        <h3>同一产物 · 外观试色</h3>
        <div class="variants" id="variants"></div>
        <div class="rows">
          <section>
            <h3>生长与采收</h3>
            <div class="stages" id="stages"></div>
          </section>
          <section>
            <h3>收获品质</h3>
            <div class="stages" id="quality"></div>
          </section>
        </div>
        <button id="save" class="export">保存收获物 SVG</button>
      </div>
    </dialog>
    <script>
      function rand(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const f = (n) => Math.round(n * 10) / 10;
      function ell(cx, cy, rx, ry, fill, rot, op) {
        rot = rot || 0;
        op = op === undefined ? 1 : op;
        return (
          `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"` +
          (rot ? ` transform="rotate(${f(rot)} ${f(cx)} ${f(cy)})"` : '') +
          (op < 1 ? ` opacity="${op}"` : '') +
          '/>'
        );
      }

      function path(d, fill, stroke = 'none', width = 1.5) {
        return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      function line(d, color, width = 1.6) {
        return path(d, 'none', color, width);
      }
      function group(transform, body) {
        return `<g transform="${transform}">${body}</g>`;
      }
      function blade(p, x, y, angle, scale = 1) {
        return group(
          `translate(${x} ${y}) rotate(${angle}) scale(${scale})`,
          path('M0 0Q4 -16 25 -12Q22 3 0 0Z', p.foliage, p.leafD) + line('M2 -1Q12 -6 20 -10', p.leafL, 1.3),
        );
      }
      function apple(p) {
        return (
          path(
            'M49 34C38 31 33 23 21 30C4 39 11 67 23 82C31 93 39 92 48 87C54 85 59 92 67 88C80 82 91 55 84 39C79 26 67 25 58 30Q52 34 49 34Z',
            p.skin,
            p.edge,
            2,
          ) +
          path('M16 45Q18 30 32 31Q38 31 41 35Q25 32 19 50Z', p.light) +
          line('M41 34Q48 40 58 33', p.shade, 2.2) +
          line('M48 35Q47 21 55 12', '#614632', 4.2) +
          blade(p, 51, 24, -12, 0.98) +
          line('M21 52Q19 57 21 62', p.light, 3.1)
        );
      }
      function mandarin(p) {
        return (
          path(
            'M11 55C11 37 24 26 44 28C63 23 82 34 84 51C88 70 70 83 47 83C25 85 9 73 11 55Z',
            p.skin,
            p.edge,
            2,
          ) +
          path('M34 31L42 31L48 27L50 32L58 33L49 35L46 40L43 35L35 36Z', p.leafD) +
          blade(p, 47, 31, -19, 0.72) +
          [
            [22, 49],
            [27, 45],
            [19, 57],
            [29, 54],
            [31, 67],
            [37, 71],
            [23, 63],
            [35, 45],
          ]
            .map(([x, y]) => ell(x, y, 1.1, 1.4, p.shade, -20, 0.72))
            .join('') +
          group(
            'rotate(-18 68 71)',
            path('M42 62Q64 71 91 59C92 75 82 87 66 87C54 87 45 78 42 62Z', p.skin, p.edge, 1.8) +
              path('M45 64Q67 72 88 62C84 86 53 94 45 64Z', '#ffedbb') +
              path(
                'M48 67L63 72L55 79Q50 75 48 67ZM58 81L66 72L68 83Q63 84 58 81ZM71 82L69 72L80 77Q76 81 71 82ZM82 75L71 70L86 66Q85 71 82 75Z',
                p.main,
              ),
          )
        );
      }
      function pear(p) {
        return (
          path(
            'M46 24Q53 19 59 26C65 35 59 44 71 54C89 69 79 88 60 91C39 96 16 88 18 68C19 53 32 48 38 40C42 34 40 27 46 24Z',
            p.skin,
            p.edge,
            2,
          ) +
          line('M50 25Q49 17 56 10', '#634f32', 3.5) +
          blade(p, 52, 19, 157, 0.65) +
          line('M27 65Q29 58 35 55', p.light, 3.5) +
          [
            [38, 78],
            [42, 82],
            [65, 68],
            [68, 72],
            [34, 74],
            [58, 84],
            [65, 79],
          ]
            .map(([x, y]) => ell(x, y, 1, 1.1, p.shade))
            .join('')
        );
      }
      function cherry(p) {
        return (
          line('M23 60Q47 46 55 17Q60 37 70 60', '#6c713a', 3.4) +
          blade(p, 55, 18, 30, 0.94) +
          line('M53 18L59 15', '#654934', 4) +
          [
            [29, 65, -16],
            [66, 72, 12],
          ]
            .map(([x, y, a]) =>
              group(
                `translate(${x} ${y}) rotate(${a})`,
                path(
                  'M0 -12C-16 -21 -25 -5 -18 9C-14 19 -2 23 8 17C21 11 23 -6 13 -12Q8 -15 0 -12Z',
                  p.skin,
                  p.edge,
                  1.8,
                ) +
                  line('M-11 -5Q-8 -10 -5 -9', p.light, 3) +
                  line('M-3 -12Q1 -9 5 -12', p.shade, 1.6),
              ),
            )
            .join('')
        );
      }
      function grape(p) {
        let s =
          line('M46 36Q53 25 56 13', '#6d5737', 4) +
          path('M52 29L37 32L34 27L20 22L30 19L26 10L39 15L42 7L51 18L57 15Z', p.foliage, p.leafD) +
          line('M49 26L34 17', p.leafL) +
          line('M56 21Q71 14 75 24Q78 33 70 30Q67 28 70 25', p.stem);
        for (const [x, y, r] of [
          [46, 80, 10],
          [38, 66, 12],
          [57, 65, 12],
          [30, 50, 12],
          [68, 47, 12],
          [40, 37, 12],
          [58, 35, 12],
          [47, 51, 13],
          [50, 66, 10],
        ])
          s +=
            ell(x, y, r, r * 1.04, p.edge) +
            ell(x, y - 0.8, r - 1.3, r * 1.04 - 1.5, p.skin) +
            ell(x - r * 0.34, y - r * 0.45, 2.6, 1.6, p.light, -30, 0.85);
        return s;
      }
      function strawberry(p) {
        return (
          path(
            'M16 41C20 24 37 26 46 30C58 23 78 27 82 41C89 56 71 77 53 89C49 92 44 90 38 85C24 73 10 55 16 41Z',
            p.skin,
            p.edge,
            2,
          ) +
          [
            [24, 47],
            [32, 55],
            [41, 46],
            [54, 47],
            [68, 43],
            [74, 54],
            [21, 57],
            [42, 63],
            [59, 58],
            [64, 68],
            [34, 69],
            [49, 77],
            [54, 68],
          ]
            .map(([x, y]) => ell(x, y, 1.8, 3, p.shade, 20) + ell(x - 0.4, y - 0.6, 1, 1.9, '#fff2af', 20))
            .join('') +
          path(
            'M47 32Q35 18 29 23L34 31L18 33L36 38L30 45Q42 43 49 36L60 43L59 36L75 34L60 29L65 22L51 29Z',
            p.foliage,
            p.leafD,
          ) +
          line('M48 32Q49 23 55 15', p.stem, 3.4)
        );
      }
      function watermelon(p) {
        return (
          path('M13 55Q40 39 62 14Q74 16 87 24C88 51 76 76 54 89Q32 84 13 59Z', p.foliage, p.leafD, 2) +
          path('M14 54L62 15L71 21Q67 60 51 82Q28 76 14 58Z', '#f4ecbc') +
          path('M16 54L61 18L66 22Q61 58 49 76Q29 69 16 54Z', p.skin, p.edge, 1.2) +
          line('M58 84Q76 63 82 37', p.leafL, 2.7) +
          [
            [32, 56, -30],
            [46, 46, 5],
            [52, 60, 20],
            [57, 32, 20],
            [41, 64, -20],
          ]
            .map(([x, y, a]) => ell(x, y, 1.8, 3.1, '#533c36', a))
            .join('')
        );
      }
      function pumpkin(p) {
        return (
          path('M44 31Q48 22 47 13L54 10Q61 16 53 32Z', '#968553', '#655b39', 1.8) +
          line('M54 27Q68 7 77 18Q82 26 73 26Q67 25 72 20', p.stem, 1.8) +
          [
            [30, 54, 22, 24, -16],
            [68, 53, 22, 25, 12],
            [39, 55, 20, 29, -8],
            [59, 55, 21, 30, 6],
            [48, 55, 16, 31, 2],
          ]
            .map(([x, y, rx, ry, a]) =>
              group(
                `rotate(${a} ${x} ${y})`,
                path(
                  `M${x} ${y - ry}C${x + rx * 1.35} ${y - ry} ${x + rx * 1.3} ${y + ry} ${x} ${y + ry}C${x - rx * 1.25} ${y + ry} ${x - rx * 1.35} ${y - ry} ${x} ${y - ry}Z`,
                  p.skin,
                  p.edge,
                  1.6,
                ),
              ),
            )
            .join('') +
          line('M39 43Q41 34 46 32', p.light, 2.8)
        );
      }
      function carrot(p) {
        return group(
          'rotate(34 50 50)',
          [
            [-26, 0.8],
            [-4, 1],
            [22, 0.86],
          ]
            .map(([a, k]) =>
              group(
                `rotate(${a} 50 38) translate(50 38) scale(${k})`,
                path(
                  'M-1 0L-5 -11L-11 -17L-6 -16L-10 -25L-4 -20L-6 -30L-2 -26L0 -35L3 -25L7 -28L5 -20L10 -24L7 -15L12 -18L6 -10L2 0Z',
                  p.foliage,
                  p.leafD,
                  1.3,
                ),
              ),
            )
            .join('') +
            path(
              'M36 38Q41 30 55 33Q68 33 64 48C59 68 54 86 48 96C44 88 38 65 35 51Q32 43 36 38Z',
              p.skin,
              p.edge,
              2,
            ) +
            line('M36 46L46 48M53 57L60 56M40 66L46 67M49 78L54 77', p.shade, 2) +
            line('M39 40Q43 37 48 38', p.light, 2.6),
        );
      }
      function radish(p) {
        return (
          blade(p, 46, 38, -116, 1.04) +
          blade(p, 49, 39, -63, 1.22) +
          blade(p, 51, 39, -8, 0.97) +
          path(
            'M21 53C20 34 48 29 63 36C86 45 78 65 64 73Q55 79 46 80Q39 91 30 91Q37 85 37 78C27 73 21 66 21 53Z',
            p.skin,
            p.edge,
            2,
          ) +
          path('M29 71Q46 82 65 71Q56 79 46 80Q38 92 30 91Q37 85 37 78Z', '#f2e5cc') +
          line('M28 49Q32 42 38 42', p.light, 3.2)
        );
      }
      function onion(p) {
        return (

      function attachedOrgan(crop, p) {
        switch (crop.id) {
          case 'mandarin':
            return ell(50, 51, 41, 34, p.skin) + path('M39 21L47 22L52 14L53 22L62 22L54 27L46 27Z', p.leafD);
          case 'watermelon':
            return (
              ell(50, 54, 47, 29, p.foliage, -9) + line('M13 54Q34 32 70 32M21 65Q55 65 83 43', p.leafL, 4)
            );
          case 'peas':
            return (
              path('M60 8Q78 27 63 55Q51 80 23 92Q33 78 33 64Q33 38 55 18Z', p.skin, p.leafD, 3) +
              line('M57 23Q39 45 37 72', p.light, 3) +
              line('M55 35q8 2 6 8M47 51q8 2 6 8M40 66q6 1 5 6', p.shade, 2.4)
            );
          case 'carrot':
            return path('M17 49Q18 22 47 22Q83 22 83 50L75 62Q44 67 20 61Z', p.skin, p.edge, 3);
          case 'radish':
          case 'onion':
            return path('M6 60Q5 18 49 17Q92 17 94 60Q49 74 6 60Z', p.skin, p.edge, 3);
          case 'broccoli':
            return [
              [24, 58, 19],
              [42, 42, 23],
              [63, 39, 20],
              [77, 54, 20],
              [53, 59, 26],
            ]
              .map(([x, y, r]) => ell(x, y, r, r * 0.8, p.edge) + ell(x, y - 1.6, r - 1.5, r * 0.74, p.skin))
              .join('');
          case 'sunflower':
            return group('translate(0 10)', sunflowerHead(p));
          case 'wheat': {
            let ear = line('M50 94L50 12', p.shade, 3);
            for (let y = 76; y > 14; y -= 15)
              for (const side of [-1, 1])
                ear +=
                  line(`M${50 + side * 11} ${y - 13}l${side * 5} -20`, p.shade, 2) +
                  path(
                    `M50 ${y + 3}q${side * 16} -2 ${side * 14} -21q${-side * 15} 3 ${-side * 14} 21Z`,
                    p.skin,
                    p.edge,
                    1.9,
                  );
            return ear;
          }
          default:
            return crop.draw(p);
        }
      }

      function field(crop, p, stage) {
        const profile = growth[crop.id];
        const sprout = stage === 1;
        const frame = sprout ? profile.young : profile.middle;
        const woody = crop.habit === 'tree';
        const stemColor = woody && !sprout ? '#866443' : p.stem;
        const width = sprout ? 2.3 : woody || crop.habit === 'corn' || crop.habit === 'banana' ? 4 : 2.9;
        let body = frame.stems ? line(frame.stems, stemColor, width) : '';
        if (!sprout && profile.tendril) body += line(profile.tendril, p.stem, 1.7);
        for (const { kind, x, y, angles, lengths } of frame.leaves) {
          angles.forEach((angle, i) => {
            body += foliageLeaf(p, kind, x, y, angle, lengths[i]);
          });
        }
        if (stage === 3) {
          if (crop.id === 'wheat') body += line('M41 88L37 43M50 88L51 28M57 88L65 42', p.shade, 2);
          if (crop.id === 'corn') body += line('M51 27L48 10M50 19L43 12M51 20L57 9', p.shade, 1.8);
          const organ = attachedOrgan(crop, p);
          for (const [x, y, size] of profile.ripe)
            body += group(`translate(${x} ${y}) scale(${size / 100}) translate(-50 -50)`, organ);
        }
        const scale = sprout ? 1.12 : stage === 2 ? 0.82 : 0.91;
        return group(`translate(50 89) scale(${scale}) translate(-50 -89)`, body);
      }

      function colorSet(variant, hueShift, leafShift, id) {
        const [, h, s, l] = variant;
        const fruit = (dh, ds, dl) =>
          `hsl(${h + hueShift + dh} ${Math.min(100, Math.max(0, s + ds))}% ${Math.min(95, Math.max(12, l + dl))}%)`;
        const green = (dh, sat, light) => `hsl(${103 + dh + leafShift} ${sat}% ${light}%)`;
        return {
          skin: `url(#skin${id})`,
          main: fruit(0, 0, 0),
          light: fruit(8, -8, 20),
          shade: fruit(-8, -5, -14),
          edge: fruit(-9, -13, -21),
          foliage: `url(#leaf${id})`,
          leaf: green(1, 35, 45),
          leafL: green(-20, 43, 62),
          leafD: green(12, 28, 30),
          stem: green(-13, 26, 32),
        };
      }

      function icon(crop, v = 0, stage = 0) {
        const id = ++svgSerial,
          p = colorSet(
            crop.variants[v],
            state.hue,
            state.leaf + (stage ? growth[crop.id].leafHue || 0 : 0),
            id,
          );
        const defs = `<defs><radialGradient id="skin${id}" cx="29%" cy="24%" r="80%"><stop stop-color="${p.light}"/><stop offset=".42" stop-color="${p.main}"/><stop offset=".82" stop-color="${p.main}"/><stop offset="1" stop-color="${p.shade}"/></radialGradient><linearGradient id="leaf${id}" x2=".78" y2="1"><stop stop-color="${p.leafL}"/><stop offset=".55" stop-color="${p.leaf}"/><stop offset="1" stop-color="${p.leafD}"/></linearGradient></defs>`;
        const seed = [...crop.id].reduce((a, ch) => (Math.imul(a, 31) + ch.charCodeAt(0)) | 0, state.salt);
        const angle = state.salt ? f(rand(seed)() * 9 - 4.5) : 0;
        const art = stage
          ? group(`rotate(${angle * 0.5} 50 89)`, field(crop, p, stage))
          : group(`rotate(${angle} 50 50)`, crop.draw(p));
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">${defs}${art}</svg>`;
      }
      const categories = ['全部', ...new Set(crops.map((c) => c.category))];
      const phases = ['收获物', '幼苗', '生长中期', '田间成熟'];
      const phaseOrder = [1, 2, 3, 0];
      const defaults = { category: '全部', stage: 0, hue: 0, leaf: 0, salt: 0, small: false, gray: false };
      let state = { ...defaults },
        svgSerial = 0,
        inspected = null,
        detailStage = 0;
      const selected = {};
      const el = (id) => document.getElementById(id);
      function render() {
        const visible = crops.filter((c) => state.category === '全部' || c.category === state.category);
        el('phase').innerHTML = phaseOrder
          .map(
            (stage) =>
              `<button data-stage="${stage}" aria-pressed="${stage === state.stage}">${phases[stage]}</button>`,
          )
          .join('');
        el('tabs').innerHTML = categories
          .map((c) => `<button data-category="${c}" aria-pressed="${c === state.category}">${c}</button>`)
          .join('');
        const example = state.category === '全部' ? crops.find((c) => c.id === 'carrot') : visible[0];
        const plate = state.stage
          ? [1, 2, 3].map((stage) => [example, selected[example.id] || 0, stage])
          : [
              [crops[0], 0, 0],
              [crops[0], 1, 0],
              [crops[1], 0, 0],
            ];
        el('plate').setAttribute(
          'aria-label',
          state.stage ? example.name + '的生长过程' : '红苹果、黄苹果与橘子的形态对照',
        );
        el('plate').innerHTML = plate
          .map(
            ([c, v, stage]) =>
              `<button data-crop="${c.id}" data-v="${v}" data-stage="${stage}">${icon(c, v, stage)}${stage ? c.name + ' · ' + phases[stage] : c.variants[v][0]}</button>`,
          )
          .join('');
        el('grid').innerHTML = visible
          .map(
            (c) =>
              `<button class="cell" data-crop="${c.id}" aria-label="查看${c.name}"><span class="mount"><span class="sample">${icon(c, selected[c.id] || 0, state.stage)}</span></span><span class="name">${c.name}</span><span class="latin" lang="en">${c.en}</span></button>`,
          )
          .join('');
        el('total').textContent =
          `${crops.length} 种示例作物　/　${crops.reduce((sum, c) => sum + c.variants.length, 0)} 个美术试色样本`;
        document.body.classList.toggle('compact', state.small);
        document.body.classList.toggle('gray', state.gray);
        el('small').setAttribute('aria-pressed', state.small);
        el('gray').setAttribute('aria-pressed', state.gray);
      }

      function showDetail(c, v, stage) {
        inspected = c;
        detailStage = stage;
        selected[c.id] = v;
        el('hero').innerHTML = icon(c, v, stage);
        el('mName').textContent = c.name;
        el('mLatin').textContent = `${c.en}　/　${phases[stage]}`;
        el('mMeta').textContent = stage ? growth[c.id].cue : c.note;
        el('save').textContent = '保存' + phases[stage] + ' SVG';
        el('variants').innerHTML = c.variants
          .map(
            (variant, i) =>
              `<button data-v="${i}" aria-pressed="${v === i}"><i class="swatch" style="background:${colorSet(variant, state.hue, state.leaf, 0).main}"></i>${variant[0]}</button>`,
          )
          .join('');
        el('stages').innerHTML = phaseOrder
          .map(
            (s) =>
              `<button class="stage" data-stage="${s}" aria-pressed="${s === stage}">${icon(c, v, s)}${phases[s]}</button>`,
          )
          .join('');
        el('quality').innerHTML = [
          ['普通', '#a69d89'],
          ['优良', '#7c9a68'],
          ['特级', '#bd9243'],
          ['四档（暂定）', '#9a7abb'],
        ]
          .map(
            ([label, color]) => `<div class="stage quality" style="--q:${color}">${icon(c, v)}${label}</div>`,
          )
          .join('');
        if (!el('detail').open) el('detail').showModal();
      }

      el('phase').onclick = (e) => {
        const b = e.target.closest('[data-stage]');
        if (b) {
          state.stage = Number(b.dataset.stage);
          render();
          el('phase').querySelector('[aria-pressed="true"]').focus();
        }
      };
      el('stages').onclick = (e) => {
        const b = e.target.closest('[data-stage]');
        if (b) {
          showDetail(inspected, selected[inspected.id], Number(b.dataset.stage));
          el('stages').querySelector('[aria-pressed="true"]').focus();
        }
      };
      el('tabs').onclick = (e) => {
        const b = e.target.closest('[data-category]');
        if (b) {
          state.category = b.dataset.category;
          render();
          el('tabs').querySelector('[aria-pressed="true"]').focus();
        }
      };
      for (const area of ['grid', 'plate'])
        el(area).onclick = (e) => {
          const b = e.target.closest('[data-crop]');
          if (b) {
            const c = crops.find((c) => c.id === b.dataset.crop);
            showDetail(c, Number(b.dataset.v ?? selected[c.id] ?? 0), Number(b.dataset.stage ?? state.stage));
          }
        };
      el('variants').onclick = (e) => {
        const b = e.target.closest('[data-v]');
        if (b) {
          showDetail(inspected, +b.dataset.v, detailStage);
          el('variants').querySelector('[aria-pressed="true"]').focus();
        }
      };
      el('save').onclick = () => {
        const index = selected[inspected.id];
        const svg = icon(inspected, index, detailStage);
        const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        const stageName = phases[detailStage];
        link.download = inspected.variants[index][0] + '-' + stageName + '.svg';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      el('closeBtn').onclick = () => el('detail').close();
      el('detail').onclick = (e) => {
        if (e.target === el('detail')) el('detail').close();
      };
      el('detail').addEventListener('close', () => {
        const focused = document.activeElement;
        const area = focused.closest('#plate,#grid');
        const index = area ? [...area.children].indexOf(focused) : -1;
        render();
        if (index >= 0) area.children[index]?.focus({ preventScroll: true });
      });
      for (const key of ['small', 'gray'])
        el(key).onclick = () => {
          state[key] = !state[key];
          render();
        };
      for (const key of ['hue', 'leaf'])
        el(key).oninput = (e) => {
          state[key] = +e.target.value;
          el(key + 'Val').textContent = state[key] + '°';
          render();
        };
      el('reroll').onclick = () => {
        state.salt = 1 + Math.floor(Math.random() * 999999);
        render();
      };
      el('reset').onclick = () => {
        state = { ...defaults };
        for (const id of Object.keys(selected)) delete selected[id];
        for (const key of ['hue', 'leaf']) {
          el(key).value = 0;
          el(key + 'Val').textContent = '0°';
        }
        render();
      };
      const query = new URLSearchParams(location.search);
      const requestedStage = Number(query.get('stage'));
      if (phaseOrder.includes(requestedStage)) state.stage = requestedStage;
      render();
      if (query.has('open')) {
        const index = Math.max(0, Math.min(crops.length - 1, parseInt(query.get('open'), 10) || 0));
        showDetail(crops[index], 0, state.stage);
      }
    </script>
  </body>
</html>
